name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.0.12077973" || echo "y" | sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          ls $ANDROID_HOME/ndk/ 2>/dev/null | head
      - name: Build native libhan1me_ech.so (fix 302 clear)
        run: |
          set -e
          if [ -f c/ssl/CMakeLists.txt ]; then
            echo "Building native with NDK..."
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_NDK=$ANDROID_NDK"
            mkdir -p /tmp/native_build && cd /tmp/native_build
            cmake /github/workspace/c/ssl $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release || cmake $GITHUB_WORKSPACE/c/ssl $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc) || cmake --build . -j$(nproc)
            find . -name "libhan1me_ech.so" | head
            SO=$(find . -name "libhan1me_ech.so" | head -n 1)
            if [ -n "$SO" ]; then
              mkdir -p $GITHUB_WORKSPACE/app/src/main/assets/han1meplus/arm64-v8a
              mkdir -p $GITHUB_WORKSPACE/app/src/main/assets/lib/arm64-v8a
              cp "$SO" $GITHUB_WORKSPACE/app/src/main/assets/han1meplus/arm64-v8a/libhan1me_ech.so
              cp "$SO" $GITHUB_WORKSPACE/app/src/main/assets/lib/arm64-v8a/libhan1me_ech.so
              ls -lh $GITHUB_WORKSPACE/app/src/main/assets/han1meplus/arm64-v8a/
            else
              echo "WARN: native so not built, using prebuilt asset"
            fi
          else
            echo "No c/ssl, skip native build"
          fi
      - run: chmod +x gradlew || true
      - run: ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: verifier, path: app/build/outputs/apk/debug/*.apk }
      - name: Notify build result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/notify-build-result.sh
